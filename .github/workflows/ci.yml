name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Get version
        if: github.ref == 'refs/heads/main'
        id: version
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Package extension
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          zip -r "../imago-v${{ steps.version.outputs.version }}.zip" .

      - name: Create or update release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Imago v${{ steps.version.outputs.version }}
          files: imago-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          make_latest: true
