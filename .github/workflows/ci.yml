name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Get version
        if: github.ref == 'refs/heads/main'
        id: version
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Package extension
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          zip -r "../imago-v${{ steps.version.outputs.version }}.zip" .

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: imago-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: imago-v${{ steps.version.outputs.version }}.zip
          retention-days: 30
